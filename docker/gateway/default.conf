server {
    listen 80;
    server_name localhost;

    # Maximum file upload size (useful for images or documents)
    client_max_body_size 20M;

    # ========================================================
    # 1. Authentication Microservice (auth-service)
    # ========================================================
    location /api/auth {
        # 'auth-service' is the name of the container on the Docker network
        proxy_pass http://auth-service:8000;

        # Standard headers for Laravel to receive the client's actual IP and host
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========================================================
    # 2. Catalog Microservice (catalog-service)
    # ========================================================
    location /api/catalog/ {
        # Strip the /api/catalog prefix: /api/catalog/movies -> /api/movies
        proxy_pass http://catalog-service:8000/api/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========================================================
    # 3. AI Assistant Microservice (assistant-service)
    # ========================================================
    location /api/assistant/ {
        # Strip the /api/assistant prefix: /api/assistant/chat -> /api/chat
        proxy_pass http://assistant-service:8000/api/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE streaming: buffer nothing, flush tokens as they arrive.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_http_version 1.1;
        chunked_transfer_encoding on;
    }

    # ========================================================
    # 4. Booking Microservice (booking-service)
    # ========================================================
    location /api/booking/ {
        # Strip the /api/booking prefix: /api/booking/reservations -> /api/reservations
        proxy_pass http://booking-service:8000/api/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check path to verify that the Gateway is responding
    location /health {
        return 200 '{"status": "Gateway OK"}';
        add_header Content-Type application/json;
    }
}
